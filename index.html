<!DOCTYPE html>
<html>
<head>
    <title>UPC Auto Populate → Airtable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 18px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056cc;
        }
    </style>
</head>
<body>

<h2>UPC Auto‑Populate → Airtable</h2>

<label>Select BIN</label>
<select id="binSelect">
    <option value="BIN-001">BIN‑001</option>
    <option value="BIN-002">BIN‑002</option>
    <option value="BIN-003">BIN‑003</option>
    <option value="BIN-004">BIN‑004</option>
    <option value="BIN-005">BIN‑005</option>
</select>

<label>Scan UPC</label>
<input id="upcInput" placeholder="Scan UPC here" />

<button onclick="lookupUPC()">Lookup & Save</button>

<p id="status"></p>

<script>
async function lookupUPC() {
    const bin = document.getElementById("binSelect").value;
    const upc = document.getElementById("upcInput").value.trim();
    const status = document.getElementById("status");

    if (!upc) {
        status.innerText = "UPC is empty.";
        return;
    }

    status.innerText = "Looking up product…";

    // GoUPC free API (no key required)
    const apiURL = `https://go-upc.com/api/v1/code/${upc}`;
    const response = await fetch(apiURL);
    const data = await response.json();

    if (!data.product) {
        status.innerText = "No product found.";
        return;
    }

    const item = data.product;

    status.innerText = "Product found. Saving to Airtable…";

    const payload = {
        fields: {
            "BIN ID": bin,
            "UPC": upc,
            "Product Name": item.title || "",
            "Description": item.description || "",
            "Brand": item.brand || "",
            "Image": item.images?.[0] || ""
        }
    };

    // Send to your Worker → Airtable
    const workerURL = "https://raspy-cell-629b.ziyad-mansur.workers.dev/";

    const airtableResponse = await fetch(workerURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    if (airtableResponse.ok) {
        status.innerText = "Saved to Airtable successfully.";
    } else {
        status.innerText = "Error saving to Airtable.";
    }

    // Clear + refocus for next scan
    setTimeout(() => {
        const upcInput = document.getElementById("upcInput");
        upcInput.value = "";
        upcInput.focus();
    }, 50);
}
</script>

</body>
</html>
